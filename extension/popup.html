<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture Notes Assistant</title>
    <style>
        body {
            width: 300px;
            font-family: Arial, sans-serif;
            margin: 10px;
        }
        h1 {
            font-size: 1.2em;
            margin-bottom: 10px;
            text-align: center;
        }
        .section {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .section-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        button {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        #status {
            min-height: 20px;
            margin-top: 10px;
            padding: 5px;
            border-radius: 4px;
            font-size: 14px;
        }
        #status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        #status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        #status.info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Lecture Notes Assistant</h1>

    <div class="section">
        <div class="section-title">Record Tab Audio</div>
        <button id="recordBtn">Start Recording</button>
        <button id="stopBtn" disabled>Stop Recording</button>
    </div>

    <div class="section">
        <div class="section-title">YouTube URL</div>
        <input type="url" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=...">
        <button id="processYoutubeBtn">Process YouTube Video</button>
    </div>

    <div class="section">
        <div class="section-title">Topic Name</div>
        <input type="text" id="topicName" placeholder="Enter topic for your notes">
    </div>

    <div id="status" class="hidden"></div>
</body>
</html>
